[project]
name = "flybye"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["icalendar>=6", "recurring-ical-events>=3", "pyyaml>=6", "tzdata", "firebase-admin>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flybye"]
