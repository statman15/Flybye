<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flybye">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
  // Android's installed app ignores theme-color's media attribute, so set one tag from the phone's mode.
  (() => {
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const tag = document.querySelector('meta[name="theme-color"]');
    const set = () => { tag.content = dark.matches ? '#0c0c0d' : '#ffffff'; };
    set();
    dark.addEventListener('change', set);
  })();
</script>
<title>Flybye</title>
<style>
  /* HypertroPhy's iPhone look (system font, follows the phone's light/dark), tinted sky blue. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --sheet: #f2f2f7; --group: #ffffff;
    --label: #111113; --label2: #636366; --sep: rgba(60, 60, 67, .2);
    --fill: rgba(118, 118, 128, .12); --fill-strong: rgba(118, 118, 128, .2);
    --tint: #0a6cc4; --on-tint: #ffffff; --danger: #d70015; --good: #1a7f37; --look: #a35200; --look-fill: rgba(255, 149, 0, .14);
    --lift: rgba(20, 30, 40, .16);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --sheet: #1c1c1e; --group: #2c2c2e;
      --label: #f5f5f7; --label2: #a1a1a6; --sep: rgba(84, 84, 88, .6);
      --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
      --tint: #64b5ff; --on-tint: #04213a; --danger: #ff6961; --good: #5dd37d; --look: #ffb340; --look-fill: rgba(255, 159, 10, .2);
      --lift: rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); overscroll-behavior-y: none; } /* our own pull-to-refresh, not the browser's */
  body { margin: 0; min-height: 100dvh; font-size: 17px; line-height: 1.3; color: var(--label); background: var(--bg);
    padding-bottom: calc(110px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; touch-action: manipulation; text-align: left; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ic { width: 22px; height: 22px; flex: none; fill: currentColor; }

  .head { padding: calc(16px + env(safe-area-inset-top)) 16px 4px; }
  .head h1 { margin: 0; font-size: 34px; font-weight: 700; line-height: 41px; letter-spacing: .01em; }
  .sub { margin: 0 0 8px; font-size: 15px; color: var(--label2); }
  .pad { padding: 0 16px; }
  .muted { color: var(--label2); font-size: 15px; }
  .sec { margin: 24px 16px 8px; font-size: 22px; font-weight: 700; }
  .sec small { display: block; font-size: 15px; font-weight: 400; color: var(--label2); }

  .group { margin: 0 16px 12px; border-radius: 12px; background: var(--group); box-shadow: inset 0 0 0 .5px var(--sep); }
  .card { padding: 14px 16px; }
  .card.hit { box-shadow: 0 0 0 2px var(--tint); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .card-top > :first-child { min-width: 0; overflow-wrap: anywhere; } .card-top > button { flex: none; }
  details.kind { margin: 0 16px 12px; border-radius: 12px; background: var(--group); box-shadow: inset 0 0 0 .5px var(--sep); }
  details.kind > summary { padding: 14px 16px; font-size: 19px; font-weight: 700; cursor: pointer; }
  details.kind > summary small { font-size: 14px; font-weight: 400; color: var(--label2); }
  details.kind[open] { padding-bottom: 4px; }
  details.kind .group { margin-left: 8px; margin-right: 8px; }
  details.kind .sec { margin: 14px 16px 6px; font-size: 17px; }
  details.more > summary { margin: 0 16px 12px; color: var(--look); font-weight: 600; cursor: pointer; }
  details.more > summary small { display: block; margin-left: 18px; font-size: 13px; font-weight: 400; color: var(--label2); }
  .form details.more > summary { color: var(--tint); } /* key instructions: a link, not a "worth a look" */
  .card.look { box-shadow: inset 4px 0 0 var(--look), inset 0 0 0 .5px var(--sep); } /* not on the wish list: an idea, not a target */
  .tag.look { color: var(--look); background: var(--look-fill); }
  .city { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
  .price { font-size: 20px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .price small { font-size: 13px; font-weight: 400; color: var(--label2); }
  .meta { margin: 4px 0 0; font-size: 15px; color: var(--label2); }
  .deal { color: var(--good); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--label2); background: var(--fill); }
  .tag.on { color: var(--on-tint); background: var(--tint); }
  .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; text-decoration: none; color: var(--on-tint); background: var(--tint); }
  .pill:active { transform: scale(.97); opacity: .9; }
  .pill.quiet { color: var(--tint); background: var(--fill); }
  .pill.small { min-height: 44px; padding: 0 16px; margin-top: 10px; }
  .pill:disabled { opacity: .5; }

  .empty { display: grid; justify-items: center; gap: 6px; padding: 56px 32px; text-align: center; }
  .empty h2 { margin: 0; font-size: 22px; }
  .empty p { max-width: 32ch; margin: 0 0 12px; color: var(--label2); }
  .err { color: var(--danger); }

  /* Forms */
  .form { display: grid; gap: 12px; padding: 14px 16px; }
  .form label { min-width: 0; display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--label2); }
  .form input:not([type=checkbox]) { height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--fill); font-size: 17px; color: var(--label); }
  .form .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .form input:not([type=checkbox]), .form select { width: 100%; min-width: 0; } /* a field's built-in width must not push the card off-screen */
  .form .check { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; color: var(--label); }
  .form .check input { width: 22px; height: 22px; accent-color: var(--tint); }
  .kind + .kind { padding-top: 12px; box-shadow: inset 0 .5px 0 var(--sep); }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill); margin-top: 10px; }
  .seg button { flex: 1; min-height: 44px; border-radius: 8px; font-size: 15px; font-weight: 500; text-align: center; }
  .seg button[aria-pressed=true] { font-weight: 600; background: var(--group); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
  button.tag { position: relative; min-height: 32px; } /* looks 32px, taps 44px */
  button.tag::after { content: ''; position: absolute; inset: -6px -2px; }
  .rows button:disabled { opacity: .6; }
  .remove { display: block; width: 100%; min-height: 44px; margin-top: 10px; border-radius: 10px; text-align: center; color: var(--danger); background: var(--fill); }

  /* Calendar rows */
  .rows { margin: 0 16px; padding: 0; list-style: none; }
  .rows li { box-shadow: inset 0 -.5px 0 var(--sep); }
  .rows button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; width: 100%; padding: 12px 0; }
  .rows button:active { opacity: .6; }
  .rows .t { font-weight: 600; overflow-wrap: anywhere; }
  .rows .why { grid-column: 1 / -1; font-size: 14px; color: var(--label2); overflow-wrap: anywhere; }
  .rows.group { padding: 0 14px; }
  .rows.group li:last-child { box-shadow: none; }
  .rows .city, .rows .price { font-size: 17px; }
  .rows .why .deal { font-weight: 600; }
  .rows button.look .city { color: var(--look); }
  .rows button.hit { box-shadow: inset 3px 0 0 var(--tint); padding-left: 8px; }
  .chip { align-self: start; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
  .chip.blocks { color: var(--on-tint); background: var(--tint); box-shadow: none; }

  /* Tab bar: HypertroPhy's floating capsule. */
  .dock { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: max(10px, calc(env(safe-area-inset-bottom) - 12px)); max-width: 560px; margin: 0 auto; }
  .tabs { display: flex; height: 64px; padding: 4px; border-radius: 999px; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--sep);
    background: color-mix(in srgb, var(--group) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  @media (prefers-reduced-transparency: reduce) { .tabs { background: var(--group); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  .tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 999px; font-size: 11px; font-weight: 600; text-align: center; color: var(--label2); }
  .tabs button span { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs button .ic { width: 25px; height: 25px; }
  .tabs button { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } /* large text: labels shorten, the dock stays on screen */
  .tabs button[aria-selected=true] { color: var(--tint); background: var(--fill); }

  /* Cards with actions, trip details, activity, setup */
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .wx { color: var(--label); }
  button.card.pick { display: block; width: calc(100% - 32px); text-align: left; }
  .rank { flex-basis: 100%; margin-top: 8px; font-size: 15px; }
  .rank p { display: flex; justify-content: space-between; margin: 2px 0; }
  .rank .total { padding-top: 4px; box-shadow: inset 0 .5px 0 var(--sep); }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin: -6px 0; padding: 0; color: var(--tint); font-weight: 600; }
  .legs { padding: 4px 16px; list-style: none; }
  .legs li { display: grid; gap: 2px; padding: 10px 0; overflow-wrap: anywhere; }
  .legs li + li { box-shadow: inset 0 .5px 0 var(--sep); }
  .errs li { font-size: 14px; }
  .hint { margin: 0; font-size: 13px; color: var(--label2); overflow-wrap: anywhere; }
  .form details.more > summary { margin: 0; padding: 12px 0; min-height: 44px; }
  ol.hint { margin: 0 0 8px; padding-left: 20px; }
  .hint a { display: inline-block; padding: 14px 0; margin: -14px 0; color: var(--tint); }
  .bar { height: 10px; margin-top: 10px; border-radius: 999px; overflow: hidden; background: var(--fill-strong); }
  .bar i { display: block; height: 100%; background: var(--tint); }
  .spin { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; border: 2px solid var(--fill-strong); border-top-color: var(--tint); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .form select { height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--fill); font-size: 17px; }
  .card-top.card, .group.card.card-top { align-items: center; }

  .update { display: block; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; font-weight: 600; text-align: center; text-decoration: none; color: var(--on-tint); background: var(--tint); }
  .update:not([hidden]) + main .head { padding-top: 16px; }
  #toast { position: fixed; z-index: 5; left: 16px; right: 16px; bottom: calc(100px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 12px 16px;
    border-radius: 14px; font-weight: 600; text-align: center; color: var(--on-tint); background: var(--tint); box-shadow: 0 10px 30px var(--lift); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

</svg>

<a id="update" class="update" target="_blank" rel="noopener noreferrer" hidden></a>
<main>

  <section data-tab="wish" id="wish" hidden></section>
  <section data-tab="settings" id="settings" hidden></section>
  <section data-tab="cal" id="cal" hidden></section>
  <section data-tab="activity" id="activity" hidden></section>

</main>

</nav>
